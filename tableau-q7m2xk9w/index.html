<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Tableau Histoire de France</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page reprise de l'ancien tableau local (studio/site.html, 29/10/2026) : en-tête et chiffres clés, alertes,
   onglets, filtres communs (séries en couleur, recherche), cartes avec vignette, calendrier du mois, fiche en panneau
   (plein écran sur téléphone, à droite sur ordinateur). */
:root{--bg:#efe6d2;--fg:#2b2116;--muted:#6e5e48;--card:#f7f0e1;--line:#d8c9a8;--accent:#9a6f08;--ok:#2e7d4f;--warn:#b5541c;
--info:#2f5d8a;--err:#b3261e;--soft:#e6dbc3;--display:"Libre Caslon Display",Georgia,"Times New Roman",serif;
--body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130d;--fg:#efe4cf;--muted:#b3a284;--card:#221c13;
--line:#3a3022;--accent:#e0b23c;--ok:#5fbf86;--warn:#f08a4b;--info:#7fb0e0;--err:#ef6a5b;--soft:#2c2418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130d;--fg:#efe4cf;--muted:#b3a284;--card:#221c13;--line:#3a3022;--accent:#e0b23c;--ok:#5fbf86;
--warn:#f08a4b;--info:#7fb0e0;--err:#ef6a5b;--soft:#2c2418;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body.fige{overflow:hidden}
main{max-width:1100px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:16px}
main>*{min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,40px);margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
h3{font-size:15px;margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
code{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.meta{color:var(--muted);font-size:14px;margin:0}
.entete{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;
font-weight:600;font-size:14px;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--accent)}
/* chiffres clés */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis>.groupe{display:contents}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi[data-ep]{cursor:pointer}.kpi[data-ep]:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b.na{color:var(--muted)}.kpi b.mauvais{color:var(--err)}.kpi b.bon{color:var(--ok)}
.kpi .l{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.kpi small{font-size:13px;font-weight:600;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi .d{color:var(--ok)}.kpi .d.bas{color:var(--warn)}
.kpi .note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.spark{display:block;width:100%;height:28px;margin-top:6px;color:var(--accent);overflow:visible}
.kpi .d2{font-size:12px;color:var(--muted);margin-top:2px}
/* alertes */
.alertes{display:grid;gap:6px}
.avis{border-left:4px solid var(--info);background:var(--card);border-radius:6px;padding:8px 12px;font-size:14px}
.avis.important{border-color:var(--warn)}.avis.grave{border-color:var(--err)}.avis.ok{border-color:var(--ok)}
.avis a{color:inherit}.avis .det{color:var(--muted)}
details summary{cursor:pointer}
/* onglets et filtres */
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5;
background:var(--bg);scrollbar-width:none}
.onglet{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;
white-space:nowrap}
.onglet[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.series{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.f{border:1.5px solid var(--c,var(--line));background:transparent;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;
cursor:pointer;white-space:nowrap}
.f[aria-pressed="true"]{background:var(--c);color:#fff}
.f.neutre{--c:var(--line)}.f.neutre[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
input[type=search]{font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;
padding:8px 11px;flex:1 1 220px;min-width:0}
.tete-bloc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* programme et listes */
.jour{font-family:var(--display);font-size:20px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;
justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
section>.jour:first-child{margin-top:0}
.jour .meta{font-family:var(--body)}
.jour.auj{color:var(--accent)}
.att{color:var(--warn);font-weight:600}
.liste{display:grid;gap:8px}
.r{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.r:hover{border-color:var(--accent)}
.r.passe{opacity:.82}
.vign{position:relative;width:72px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--c,#555);display:grid;
place-items:center;flex:none}
.vign .emo{font-size:26px;line-height:1}
.vign img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vign.grande{width:100%;border-radius:8px}.vign.grande .emo{font-size:64px}
.vign.mini{width:30px;border-radius:4px}.vign.mini .emo{font-size:13px}
.t{display:grid;gap:4px;min-width:0}
.h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.heure{font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap;background:var(--c);
color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:4px;line-height:1.4}
.titre{margin:0;overflow-wrap:anywhere;font-weight:600}
.pastilles{display:flex;gap:5px;flex-wrap:wrap}
.p{font-size:12px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-decoration:none}
.p.ok{border-color:var(--ok);color:var(--ok)}.p.prevu{border-color:var(--info);color:var(--info)}
.p.cours{border-color:var(--accent);color:var(--accent)}.p.alerte{border-color:var(--warn);color:var(--warn)}
.p.erreur{border-color:var(--err);color:var(--err);font-weight:600}.p.inconnu{border-style:dashed}
a.p:hover{text-decoration:underline}
.chiffres{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:64px}
.chiffres b{display:block;font-size:18px;color:var(--fg)}
.vide{color:var(--muted);font-style:italic;padding:8px 0;margin:0}
.trou{padding:8px 12px;border-radius:8px;font-style:normal;
background:repeating-linear-gradient(135deg,var(--card),var(--card) 6px,var(--soft) 6px,var(--soft) 12px)}
.plus{margin-top:14px;width:100%}
/* calendrier */
.cal-tete{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legende-cal{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}
.grille{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.jsem{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.case{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:96px;padding:4px;display:grid;align-content:start;
gap:3px;min-width:0;cursor:pointer}
.case.hors{opacity:.4}.case.auj{border:2px solid var(--accent)}.case.choisi{outline:2px solid var(--info);outline-offset:1px}
.case.trou{background:repeating-linear-gradient(135deg,var(--card),var(--card) 6px,var(--soft) 6px,var(--soft) 12px)}
.case .n{font-size:12px;font-weight:700;color:var(--muted)}
.puce{display:block;width:100%;border:0;border-left:3px solid var(--c);background:var(--soft);border-radius:3px;font-size:11px;line-height:1.25;
padding:2px 4px;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.puce.passe{opacity:.7}
#cal-liste{margin-top:8px}
/* statistiques */
#stats,#vue-stats,#vue-episodes,#vue-coulisses,#qualite{display:grid;gap:16px;align-content:start}
#stats>*,#vue-stats>*,#vue-episodes>*,#vue-coulisses>*,#qualite>*,.liste>*{min-width:0}
.panneaux{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.bloc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.bloc p{margin:0}.bloc-in{display:grid;gap:8px}
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.top h3 .u{color:var(--muted);font-weight:400;font-size:12px}
.top ol{margin:0;padding:0;list-style:none}
.top li{padding:6px 0;border-top:1px solid var(--line)}.top li:first-child{border-top:0}
.top li a{display:flex;gap:8px;align-items:center;color:inherit;text-decoration:none;font-size:13px}
.top .tt{flex:1;min-width:0}
.top .x{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top .dd{display:block;color:var(--muted);font-size:11px}
.top .nb{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .bar{display:block;height:3px;border-radius:2px;background:var(--c,var(--accent));margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child,th.g,td.g{text-align:left}td:not(.g){white-space:nowrap}
th{font-size:12px;color:var(--muted);white-space:nowrap}
table.tri th{cursor:pointer;user-select:none}th[aria-sort]{color:var(--fg)}
tbody tr[data-ep]{cursor:pointer}tbody tr[data-ep]:hover{background:var(--soft)}
td.sujet{min-width:220px}
.defile{overflow-x:auto}
.barres{display:grid;grid-template-columns:minmax(0,2fr) minmax(60px,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.barres .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;text-decoration:none}
.barres .b{height:8px;background:var(--c,var(--accent));border-radius:4px;min-width:2px}
.ab{display:grid;gap:2px}
/* qualité et coulisses */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:transparent;cursor:pointer}
ul.lst{margin:0;padding-left:18px;font-size:14px}ul.lst li{margin:3px 0}
.machs{display:grid;gap:6px}
.mach{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
a.mach[href]:hover{border-color:var(--accent)}
.mach .nom{font-weight:600;display:block}.mach .q{display:block;color:var(--muted);font-size:13px}
.mach .msg{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12px;margin-top:2px}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.pt.ok{background:var(--ok)}.pt.prevu{background:var(--info)}.pt.cours{background:var(--accent)}.pt.alerte{background:var(--warn)}
.pt.erreur{background:var(--err)}
.okt{color:var(--ok)}.alt{color:var(--warn)}.err{color:var(--err)}
/* fiche */
.fiche{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:1fr;background:rgba(0,0,0,.5)}
.fiche-in{background:var(--bg);overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start;grid-template-columns:minmax(0,1fr);
overscroll-behavior:contain}
@media (min-width:900px){.fiche{grid-template-columns:1fr min(880px,94vw)}
.fiche-in{grid-column:2;grid-template-columns:280px minmax(0,1fr);border-left:1px solid var(--line)}.fiche-in>.plein{grid-column:1/-1}}
.fiche-tete{display:flex;justify-content:space-between;gap:12px;align-items:start}
.fermer{border:0;background:var(--soft);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.media{display:grid;gap:10px;align-content:start}
.poster{position:relative}
.poster iframe{display:block;width:100%;aspect-ratio:9/16;border:0;border-radius:8px;background:#000}
.lire{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;
background:rgba(0,0,0,.62);color:#fff;font-size:26px;cursor:pointer}
.liens{display:flex;flex-wrap:wrap;gap:6px}
.infos{display:grid;gap:12px;align-content:start;min-width:0}
.ms .res{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mini-stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.mini-stats b{display:block;font-size:18px}.mini-stats span{font-size:12px;color:var(--muted)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
footer{color:var(--muted);font-size:13px}
@media (max-width:1000px){.tops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){.media .vign.grande,.poster iframe{max-width:260px;margin:0 auto}}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tops{grid-template-columns:1fr}}
@media (max-width:560px){
.r{grid-template-columns:56px minmax(0,1fr)}.r .vign{width:56px}
.chiffres{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}.chiffres b{display:inline;font-size:15px}
.series{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.onglet{padding:10px 11px}
.case{min-height:64px;padding:2px}
.puce{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--c)}
.kpi b{font-size:21px}.kpi .d2{display:none}}
</style></head><body><main>
<div class="entete"><div><h1>Histoire de France</h1><p class="meta" id="maj"></p></div></div>
<section class="kpis" aria-label="Chiffres clés"><div class="groupe" id="abonnes"></div><div class="groupe" id="kpis"></div></section>

<button class="onglet" role="tab" id="o-stats" data-vue="stats" aria-selected="false">Statistiques</button>
<button class="onglet" role="tab" id="o-episodes" data-vue="episodes" aria-selected="false">Épisodes</button>
<button class="onglet" role="tab" id="o-qualite" data-vue="qualite" aria-selected="false">Qualité</button>
<button class="onglet" role="tab" id="o-coulisses" data-vue="coulisses" aria-selected="false">Coulisses</button>
</nav>
<div class="filtres" id="filtres"><div class="series" id="f-series" role="group" aria-label="Séries"></div>

<section id="vue-programme"></section>
<section id="vue-calendrier" hidden></section>
<section id="vue-stats" hidden><div id="stats"></div>
<div class="panneaux"><div class="bloc" id="derniers"></div><div class="bloc" id="courbes"></div></div>
<div class="bloc" id="tableau-reels"></div></section>
<section id="vue-episodes" hidden><div class="tete-bloc"><div class="series" id="f-statut" role="group" aria-label="Statut"></div>

<section id="vue-qualite" hidden><div id="qualite"></div></section>
<section id="vue-coulisses" hidden><div class="panneaux">
<div class="bloc"><h2>Automates GitHub</h2><div class="machs" id="automates"></div></div>
<div class="bloc"><h2>Agents Claude</h2><div class="machs" id="agents"></div><div id="prog"></div></div>

</main>

function ilya(iso){if(!iso)return'';const m=Math.round((maintenant-new Date(iso))/60000);
 if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<48)return`il y a ${h} h`;return`il y a ${Math.round(h/24)} j`}
function iso10(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function plusJours(iso,k){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+k);return iso10(d)}

 return k===0?"Aujourd'hui":k===1?'Demain':k===-1?'Hier':''}

function couleur(s){if(SERIES[s])return SERIES[s][1];let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))>>>0;
 return['#6d4c8a','#8a5a2f','#2f6d8a','#8a2f4f','#4f6d2f'][h%5]}

function propre(t){t=String(t||'').split('\n')[0].replace(/\[[^\]]*\]\s*/g,'').trim();
 t=t.replace(/^[^\p{L}\p{N}«"(]+/u,'').replace(/^[A-ZÀ-Ÿ'’ ?]{4,}\s+[—–-]\s+/,'');

function suite(img){const l=String(img.dataset.suite||'').split(' ').filter(Boolean);if(l.length){img.dataset.suite=l.slice(1).join(' ');img.src=l[0]}else img.remove()}

function pill(nom,x){if(!x)return'';const c=esc(x.e||'inconnu'),t=`${esc(nom)} · ${esc(x.t||'')}`;

// En-tête : abonnés (dernier relevé, écart sur 7 jours, courbe des 30 derniers jours), chiffres clés, alertes
function courbe(c,nom){if(!c||c.length<2)return'';const t=c.map(p=>new Date(p[0]+'T12:00:00').getTime()),v=c.map(p=>p[1]);
 const t0=t[0],dt_=(t[t.length-1]-t0)||1,mn=Math.min(...v),mx=Math.max(...v),W=100,H=28;
 const pts=c.map((p,i)=>`${((t[i]-t0)/dt_*W).toFixed(1)},${(mx===mn?H/2:H-2-(v[i]-mn)/(mx-mn)*(H-4)).toFixed(1)}`).join(' ');
 const titre=`${nom} : ${nf(v[0])} le ${jm(c[0][0])}, ${nf(v[v.length-1])} le ${jm(c[c.length-1][0])}`;
 return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(titre)}"><title>${esc(titre)}</title>
 <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
 <div class="d2">${signe(v[v.length-1]-v[0])} depuis le ${jm(c[0][0])}</div>`}

function vueProgramme(){const par={};for(const j of D.jours||[])par[j.jour]=(j.pubs||[]).filter(p=>garde(p.ep,p.serie));
