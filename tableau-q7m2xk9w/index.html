<script>
const D=JSON.parse(document.getElementById('donnees').textContent);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const maintenant=new Date(D.maj);
function ilya(iso){if(!iso)return'';const m=Math.round((maintenant-new Date(iso))/60000);
 if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<48)return`il y a ${h} h`;return`il y a ${Math.round(h/24)} j`}
function nomJour(j){const d=new Date(j+'T12:00:00');const a=new Date(D.maj.slice(0,10)+'T12:00:00');const k=Math.round((d-a)/864e5);
 return k===0?"Aujourd'hui":k===1?'Demain':k===-1?'Hier':`${JOURS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`}
function pill(nom,x){if(!x)return'';const c=x.e||'inconnu';const t=`<span class="pt"></span>${esc(nom)} · ${esc(x.t||'')}`;
 return x.l?`<a class="pill ${c}" href="${esc(x.l)}">${t}</a>`:`<span class="pill ${c}">${t}</span>`}
document.getElementById('maj').textContent='Mis à jour le '+new Date(D.maj).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const pannes=[...D.automates,...D.agents].filter(a=>a.e==='erreur'||a.e==='alerte');
const nb=D.alertes.length+pannes.length;
document.getElementById('etat').innerHTML=nb?`<div class="etat ko">⚠ ${nb} point(s) à surveiller :
 ${[...D.alertes.map(a=>`<a href="${esc(a.url)}">${esc(a.title)}</a>`),...pannes.map(a=>esc(a.nom))].join(' · ')}</div>`
 :'<div class="etat ok">✓ Tout tourne normalement</div>';
const A=D.abonnes||{};document.getElementById('abonnes').innerHTML=[['facebook','Facebook'],['instagram','Instagram'],['youtube','YouTube']]
 .map(([k,n])=>A[k]?`<div class="carte"><div class="n">${(A[k].n??'?').toLocaleString('fr-FR')}</div><div class="l">${n}</div>${A[k].delta!=null?`<div class="d">${A[k].delta>=0?'+':''}${A[k].delta.toLocaleString('fr-FR')} en 7 jours</div>`:''}</div>`:'').join('');
document.getElementById('jours').innerHTML=D.jours.map(j=>`<div class="jour"><h3>${nomJour(j.jour)}</h3><div class="carte">${
 j.pubs.map(p=>`<div class="pub"><div class="h"><span class="heure">${esc(p.heure)}</span><span class="titre"><span class="serie">${esc(p.serie)}</span>${esc(p.titre)}</span></div>
 <div class="pills">${pill('Facebook',p.fb)}${pill('Instagram',p.ig)}${pill('TikTok',p.tt)}${pill('YouTube',p.yt)}${pill('Story',p.story)}</div></div>`).join('')}</div></div>`).join('')||'<div class="carte vide">Aucune publication.</div>';
const mach=a=>`<a class="carte mach" ${a.url?`href="${esc(a.url)}"`:''}><div class="nom"><span class="pt ${a.e}"></span>${esc(a.nom)}</div>
 <div class="q">${a.quand?ilya(a.quand):'jamais vu'}${a.horaire?' · '+esc(a.horaire):''}</div>${a.message?`<div class="msg">${esc(a.message)}</div>`:''}</a>`;
document.getElementById('automates').innerHTML=D.automates.map(mach).join('');
document.getElementById('agents').innerHTML=D.agents.map(mach).join('');
document.getElementById('prog').innerHTML=`<p><b>Dernier passage du programmateur</b> <span style="color:var(--doux)">(${esc(D.programmateur.quand)})</span></p><ul>${D.programmateur.lignes.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
const P=D.production;document.getElementById('prod').innerHTML=`<p><span class="pt ${P.voix_ok?'ok':'erreur'}" style="display:inline-block;margin-right:6px"></span>Voix ElevenLabs : ${esc(P.voix)}</p>
 <p>En attente de relecture : ${P.a_relire.length?esc(P.a_relire.join(', ')):'aucune'}</p><p>En cours de fabrication ou à reprendre : ${P.a_corriger.length?esc(P.a_corriger.join(', ')):'aucune'}</p>`;
// Épisodes
const R=D.registre||{};const ids=Object.keys(R).sort();let filtre='tous';
const FILTRES=[['tous','Tous'],['publié','Publiés'],['programmé','Programmés'],['au stock','Au stock'],['refaits','Refaits'],['retirés','Retirés']];
document.getElementById('filtres').innerHTML=FILTRES.map(([k,n])=>`<button data-f="${k}" class="${k==='tous'?'on':''}">${n}</button>`).join('');
document.getElementById('filtres').onclick=e=>{const b=e.target.closest('button');if(!b)return;filtre=b.dataset.f;
 document.querySelectorAll('#filtres button').forEach(x=>x.classList.toggle('on',x===b));montrer()};
const dt=s=>s?new Date(s.length<=16?s+':00':s).toLocaleString('fr-FR',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function lignesReseau(nom,liste){if(!liste||!liste.length)return'';return`<tr><td>${nom}</td><td>${liste.map(x=>{
 const quoi=x.prevu?'prévu':(x.sortie===false?'programmé':'publié');const v=x.version?` · v${x.version}`:'';
 const t=`${quoi} ${dt(x.date)}${v}${x.note?' · '+esc(x.note):''}${x.statut&&nom==='TikTok'?' · '+esc(x.statut):''}`;
 return x.lien?`<a href="${esc(x.lien)}">${t}</a>`:t}).join('<br>')}</td></tr>`}
function fiche(id){const f=R[id];const s=f.stats||{};const chiffres=[s.facebook_spectateurs!=null?`${s.facebook_spectateurs.toLocaleString('fr-FR')} spectateurs Facebook`:'',
 s.facebook_moyenne_s!=null?`${s.facebook_moyenne_s} s regardées en moyenne`:'',s.facebook_partages!=null?`${s.facebook_partages} partages`:'',
 s.youtube_vues!=null?`${s.youtube_vues} vues YouTube`:''].filter(Boolean).join(' · ');
 const vers=(f.versions||[]).map(v=>`v${v.v} (${dt(v.le)}) : ${esc(v.raison)}`).join('<br>');
 const sto=(f.stories||[]).map(x=>`${esc(x.date)} : ${[x.facebook?'Facebook':'',x.instagram?'Instagram':''].filter(Boolean).join(' + ')||'—'}`).join('<br>');
 return`<details class="ep"><summary><span class="st">${esc(f.statut)}${f.retire?' · retiré':''}</span><span class="id">${esc(f.serie)} · ${esc(id)}</span><br>${esc(f.titre||f.accroche)}</summary>
 <table>${f.retire?`<tr><td>Retiré</td><td>${esc(f.retire)}</td></tr>`:''}<tr><td>Versions</td><td>${vers||'—'}${f.version_stock?`<br><b>au stock : v${f.version_stock}</b>`:''}</td></tr>
 ${lignesReseau('Facebook',f.facebook)}${lignesReseau('Instagram',f.instagram)}${lignesReseau('TikTok',f.tiktok)}${lignesReseau('YouTube',f.youtube)}
 ${sto?`<tr><td>Story</td><td>${sto}</td></tr>`:''}${chiffres?`<tr><td>Chiffres</td><td>${chiffres}</td></tr>`:''}</table></details>`}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function montrer(){const q=norm(document.getElementById('q').value);const l=ids.filter(id=>{const f=R[id];
 if(filtre==='refaits'&&!((f.versions||[]).length>1))return false;if(filtre==='retirés'&&!f.retire)return false;
 if(!['tous','refaits','retirés'].includes(filtre)&&f.statut!==filtre)return false;
 return!q||norm(id+' '+f.titre+' '+f.accroche+' '+f.serie).includes(q)});
 document.getElementById('eps').innerHTML=l.slice(0,60).map(fiche).join('')+(l.length>60?`<div class="vide">… et ${l.length-60} autres : affinez la recherche.</div>`:'')||'<div class="vide">Aucun épisode.</div>'}
document.getElementById('q').oninput=montrer;montrer();
</script></body></html>
