<style>
:root{--fond:#f5f1ea;--carte:#fffdf9;--texte:#1d1b18;--doux:#6f6a62;--ligne:#e6dfd3;--accent:#8a2b1f;
--ok:#2f8a4c;--prevu:#5b6b85;--cours:#b98a1b;--alerte:#d07a12;--erreur:#c0392b;--ombre:0 1px 2px rgba(40,30,20,.08)}
@media (prefers-color-scheme:dark){:root{--fond:#141311;--carte:#1e1c19;--texte:#ece7df;--doux:#a39d93;--ligne:#302c27;
--accent:#e08a74;--ok:#4cc275;--prevu:#8fa2c4;--cours:#e0b448;--alerte:#f0a04a;--erreur:#ef6a5b;--ombre:none}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);
font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
header h1{font:700 20px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 2px;letter-spacing:.2px}
header .maj{color:var(--doux);font-size:13px}
.etat{margin:14px 0;padding:12px 14px;border-radius:12px;font-weight:600;line-height:1.5}
.etat.ok{background:color-mix(in srgb,var(--ok) 14%,var(--carte));color:var(--ok)}
.etat.ko{background:color-mix(in srgb,var(--erreur) 14%,var(--carte));color:var(--erreur)}
.etat a{color:inherit}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);margin:26px 0 10px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;box-shadow:var(--ombre)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chiffres .carte{padding:12px;min-width:0}.chiffres .n{font:700 22px/1.1 Georgia,serif}.chiffres .l{color:var(--doux);font-size:12px;margin-top:2px}
.chiffres .d{font-size:12px;color:var(--ok);margin-top:4px}.chiffres .d.bas{color:var(--alerte)}
.chiffres .n.na{color:var(--doux)}.chiffres .note{font-size:12px;color:var(--doux);margin-top:4px;line-height:1.3}
.spark{display:block;width:100%;height:26px;margin-top:8px;color:var(--accent);overflow:visible}
.chiffres .d2{font-size:11px;color:var(--doux);margin-top:2px}
nav.sauts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
nav.sauts a{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte);text-decoration:none}
.tops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.top{padding:10px 12px;min-width:0}.top h3{font-size:13px;margin:0 0 4px}.top .u{color:var(--doux);font-weight:400;font-size:12px}
.top ol{margin:0;padding:0;list-style:none}.top li{position:relative;padding:7px 0 9px;border-top:1px solid var(--ligne)}.top li:first-child{border-top:0}
.top li a{display:flex;gap:8px;align-items:baseline;color:inherit;text-decoration:none;font-size:13px}
.top .tt{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top .dd{color:var(--doux);font-size:11px;white-space:nowrap}.top .nb{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .barre{position:absolute;left:0;bottom:3px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.top .vide{padding:6px 0}
table.series{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.series th{font-weight:600;color:var(--doux);font-size:12px;text-align:right;padding:4px 4px 6px}
table.series td{padding:6px 4px;border-top:1px solid var(--ligne);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;white-space:nowrap}
table.series th:first-child,table.series td:first-child{text-align:left;white-space:normal}
table.series .k{color:var(--doux);font-size:11px}
.kpi{margin:1px 0 5px}.kpi .res{display:block;color:var(--doux);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.okt{color:var(--ok)}.alt{color:var(--alerte)}.doux{color:var(--doux)}
.jour{margin-bottom:14px}.jour h3{font-size:15px;margin:0 0 8px}
.pub{padding:12px 14px;border-top:1px solid var(--ligne)}.pub:first-of-type{border-top:0}
.pub .h{display:flex;gap:10px;align-items:baseline}.pub .heure{font-weight:700;font-variant-numeric:tabular-nums;min-width:44px}
.pub .titre{flex:1;min-width:0}.pub .serie{display:block;color:var(--doux);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 54px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;
border:1px solid var(--ligne);color:var(--texte);text-decoration:none;white-space:nowrap}
.pt{width:8px;height:8px;border-radius:50%;flex:none}
.ok .pt,.pt.ok{background:var(--ok)}.prevu .pt,.pt.prevu{background:var(--prevu)}.cours .pt,.pt.cours{background:var(--cours)}
.alerte .pt,.pt.alerte{background:var(--alerte)}.erreur .pt,.pt.erreur{background:var(--erreur)}.inconnu .pt,.pt.inconnu{background:var(--doux)}
.pill.alerte,.pill.erreur{border-color:currentColor}.pill.alerte{color:var(--alerte)}.pill.erreur{color:var(--erreur)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mach{padding:11px 12px;display:block;color:inherit;text-decoration:none}
.mach .nom{font-weight:600;display:flex;gap:8px;align-items:center}.mach .q{color:var(--doux);font-size:12px;margin-top:3px}
.mach .msg{font-size:12px;color:var(--doux);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bloc{padding:12px 14px}.bloc p{margin:4px 0}.bloc ul{margin:6px 0 0;padding-left:18px}.bloc li{margin:3px 0;color:var(--doux);font-size:13px}
input[type=search]{width:100%;font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte)}
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filtres button{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte)}
.filtres button.on{background:var(--texte);color:var(--carte);border-color:var(--texte)}
.ep{padding:12px 14px;border-top:1px solid var(--ligne)}.ep:first-child{border-top:0}
.ep summary{cursor:pointer;list-style:none}.ep summary::-webkit-details-marker{display:none}
.ep .id{color:var(--doux);font-size:11px}.ep .st{float:right;font-size:12px;color:var(--doux)}
.ep table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.ep td{padding:5px 4px;border-top:1px solid var(--ligne);vertical-align:top}
.ep td:first-child{color:var(--doux);width:92px}.ep a{color:var(--accent)}
.vide{color:var(--doux);padding:14px;font-size:13px}
footer{margin-top:28px;color:var(--doux);font-size:12px}footer a{color:var(--accent)}
@media (max-width:640px){.chiffres{grid-template-columns:1fr 1fr}.tops{grid-template-columns:1fr}}
@media (max-width:520px){.grille{grid-template-columns:1fr}.pills{margin-left:0}}

<script>

const maintenant=new Date(D.maj);
function ilya(iso){if(!iso)return'';const m=Math.round((maintenant-new Date(iso))/60000);

 return k===0?"Aujourd'hui":k===1?'Demain':k===-1?'Hier':`${JOURS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`}
function pill(nom,x){if(!x)return'';const c=x.e||'inconnu';const t=`<span class="pt"></span>${esc(nom)} · ${esc(x.t||'')}`;
 return x.l?`<a class="pill ${c}" href="${esc(x.l)}">${t}</a>`:`<span class="pill ${c}">${t}</span>`}

// Formats (déclarés avant tout usage : une fonction appelée avant sa définition laisse la page vide)
function nf(n){return n==null?'?':Number(n).toLocaleString('fr-FR')}
function fr1(n){return n==null?'?':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1})}
function pct(r){return r==null?'?':Math.round(r*100)+' %'}
function mo(o){return o==null?'?':Math.round(o/1e6).toLocaleString('fr-FR')+' Mo'}
function go(o){return o==null?'?':o<1e9?mo(o):(o/1e9).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Go'}
function jm(j){const d=new Date(String(j).slice(0,10)+'T12:00:00');return isNaN(d)?'':`${d.getDate()}/${d.getMonth()+1}`}
function signe(n){return(n>=0?'+':'')+nf(n)}

function courbe(c,nom){if(!c||c.length<2)return'';const t=c.map(p=>new Date(p[0]+'T12:00:00').getTime()),v=c.map(p=>p[1]);

 const titre=`${nom} : ${nf(v[0])} le ${jm(c[0][0])}, ${nf(v[v.length-1])} le ${jm(c[c.length-1][0])}`;
 return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(titre)}"><title>${esc(titre)}</title>
 <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
 <div class="d2">${signe(v[v.length-1]-v[0])} depuis le ${jm(c[0][0])}</div>`}

function rendreStats(){const el=document.getElementById('stats');if(S.panne){el.innerHTML=`<div class="carte vide">Section en panne (${esc(S.panne)}).</div>`;return}
 const t=(S.top||{})[fen]||{};

 <p>Convergence des cartes, par semaine : rendus acceptés par les contrôles du premier coup, relectures jugées PUBLIABLE, relectures par carte devenue publiable</p><ul>${[...((Q.convergence||{}).semaines||[]),...((Q.convergence||{}).jours||[]).slice(0,7)].map(s=>`<li>${esc(s.semaine)} · rendus ${s.acceptes}/${s.rendus}${s.taux_rendus!=null?' ('+Math.round(100*s.taux_rendus)+' %)':''} · relectures ${s.publiables}/${s.relectures}${s.taux_relectures!=null?' ('+Math.round(100*s.taux_relectures)+' %)':''} · ${s.relectures_par_publiable!=null?esc(s.relectures_par_publiable)+' relecture(s) par carte publiable':'aucune carte devenue publiable'}</li>`).join('')||'<li>pas encore de mesure</li>'}</ul> <p>Motifs de refus des 7 derniers jours : ${((Q.convergence||{}).motifs||[]).map(m=>esc(m[0])+' '+m[1]).join(', ')||'aucun'}</p>
 <p>Dernières relectures :</p><ul>${Q.relectures.map(x=>`<li>${esc((x.le||'').replace('T',' '))} · ${esc(x.id)} · ${esc(x.verdict)}${x.clarte!=null?' ('+esc(x.clarte)+'/10)':''} · ${esc(x.relecteur||'')}</li>`).join('')||'<li>aucune</li>'}</ul>`;
// Sauvegarde (29/10/2026) : stock (release GitHub « stock ») et copie sur Backblaze B2, lue en lecture seule
const B=D.sauvegarde||{};
(function(){const el=document.getElementById('sauvegarde');const run=D.automates.find(a=>a.nom==='Sauvegarde Backblaze');
 const passage=run?`<p>Dernier passage de la copie : <span class="pt ${run.e}" style="display:inline-block;margin:0 4px"></span>${run.quand?ilya(run.quand):'jamais vu'}${run.url?` · <a href="${esc(run.url)}" style="color:var(--accent)">détail</a>`:''}</p>`:'';
 if(B.panne||B.erreur){el.innerHTML=`<p><span class="pt erreur" style="display:inline-block;margin-right:6px"></span>${esc(B.erreur||'Section en panne ('+B.panne+')')}</p>${passage}`;return}
 const st=B.stock||{};const lu=!!B.b2;const m=B.manquants||[];
 el.innerHTML=`<p><b>Stock</b> (release GitHub « stock ») : ${nf(st.fichiers)} fichiers, ${go(st.octets)} · ${nf(st.actuelles)} vidéos actuelles et ${nf(st.anciennes)} anciennes versions · <a href="https://github.com/pofleck/hdf-studio/releases/tag/stock" style="color:var(--accent)">voir</a></p>
 ${lu?`<p><span class="pt ${m.length?'alerte':'ok'}" style="display:inline-block;margin-right:6px"></span><b>Sauvegardés sur Backblaze B2</b> : ${nf(B.sauvegardes)} sur ${nf(st.fichiers)} (${go(B.octets_sauvegardes)})</p>
 <p>Dernière copie reçue par B2 : ${B.b2.derniere_copie?esc(dt(B.b2.derniere_copie))+' ('+ilya(B.b2.derniere_copie)+')':'?'}</p>${passage}
 <p>Pas encore sauvegardés : ${m.length?`${m.length} (${go(m.reduce((s,x)=>s+x.taille,0))})</p><ul>${m.slice(0,30).map(x=>`<li>${esc(x.nom)} · ${mo(x.taille)}</li>`).join('')}${m.length>30?`<li>… et ${m.length-30} autres</li>`:''}</ul>`:'aucun</p>'}
 <p class="doux" style="font-size:12px">Le bucket garde ${nf(B.b2.fichiers)} fichiers (${go(B.b2.octets)}, dernière version de chacun) et toutes les versions précédentes ; verrouillage d'un an : rien ne peut y être effacé. Copie chaque nuit et après chaque production. Fichiers : <a href="https://secure.backblaze.com/b2_buckets.htm" style="color:var(--accent)">Backblaze</a> (connexion du propriétaire).</p>`
 :`<p><span class="pt inconnu" style="display:inline-block;margin-right:6px"></span>Backblaze B2 : ${esc(B.b2_erreur||'non lu')}</p>${passage}`}`})();
// Épisodes
const R=D.registre||{};const ids=Object.keys(R).sort();let filtre='tous';
const FILTRES=[['tous','Tous'],['publié','Publiés'],['programmé','Programmés'],['au stock','Au stock'],['refaits','Refaits'],['retirés','Retirés'],['écarts','Écarts'],['validés','Validés']];
document.getElementById('filtres').innerHTML=FILTRES.map(([k,n])=>`<button data-f="${k}" class="${k==='tous'?'on':''}">${n}</button>`).join('');
document.getElementById('filtres').onclick=e=>{const b=e.target.closest('button');if(!b)return;filtre=b.dataset.f;
 document.querySelectorAll('#filtres button').forEach(x=>x.classList.toggle('on',x===b));montrer()};
function lignesReseau(nom,liste){if(!liste||!liste.length)return'';return`<tr><td>${nom}</td><td>${liste.map(x=>{
 const quoi=x.prevu?'prévu':(x.sortie===false?'programmé':'publié');const v=x.version?` · v${x.version}`:'';
 const t=`${quoi} ${dt(x.date)}${v}${x.note?' · '+esc(x.note):''}${x.statut&&nom==='TikTok'?' · '+esc(x.statut):''}`;
 return x.lien?`<a href="${esc(x.lien)}">${t}</a>`:t}).join('<br>')}</td></tr>`}
// Chiffres d'un épisode, une ligne par réseau (registre.json, stats_de)
function kpi(res,parts){const p=parts.filter(Boolean);return p.length?`<div class="kpi"><span class="res">${res}</span>${p.join(' · ')}</div>`:''}
function chiffresReseaux(s){return[
 s.facebook_spectateurs!=null?kpi('Facebook',[`<b>${nf(s.facebook_spectateurs)}</b> spectateurs`,s.facebook_moyenne_s!=null&&`<b>${fr1(s.facebook_moyenne_s)} s</b> vues en moyenne`,
  s.facebook_retention_3s!=null&&`<b>${pct(s.facebook_retention_3s)}</b> encore là à 3 s`,s.facebook_partages!=null&&`<b>${nf(s.facebook_partages)}</b> partages`]):'',
 s.instagram_vues!=null?kpi('Instagram',[`<b>${nf(s.instagram_vues)}</b> vues`,s.instagram_moyenne_s!=null&&`<b>${fr1(s.instagram_moyenne_s)} s</b> vues en moyenne`,
  s.instagram_partages!=null&&`<b>${nf(s.instagram_partages)}</b> partages`]):'',
 s.youtube_vues!=null?kpi('YouTube',[`<b>${nf(s.youtube_vues)}</b> vues`,s.youtube_moyenne_s!=null&&`<b>${fr1(s.youtube_moyenne_s)} s</b> vues en moyenne`,
  s.youtube_part_vue!=null&&`<b>${pct(s.youtube_part_vue)}</b> de la vidéo vue`]):'',
 s.tiktok_vues!=null?kpi('TikTok',[`<b>${nf(s.tiktok_vues)}</b> vues`,s.tiktok_likes!=null&&`<b>${nf(s.tiktok_likes)}</b> j'aime`,
  s.tiktok_partages!=null&&`<b>${nf(s.tiktok_partages)}</b> partages`]):''].join('')}
const STOCK_LU=!!(D.sauvegarde&&D.sauvegarde.stock);
function etatB2(v){return v.b2===true?' · <span class="okt">sauvegardée</span>':v.b2===false&&v.fichier?' · <span class="alt">pas encore sauvegardée</span>':''}
function fiche(id){const f=R[id];const chiffres=chiffresReseaux(f.stats||{});
 const vers=(f.versions||[]).map(v=>`v${v.v} (${dt(v.le)}) : ${esc(v.raison)}${v.fichier?` · <a href="${STOCK}${encodeURIComponent(v.fichier)}">fichier</a>`:STOCK_LU?' · <span class="doux">plus dans le stock</span>':''}${etatB2(v)}`).join('<br>');
 const vs=(f.versions||[]).find(v=>v.v===f.version_stock);
 const sauv=!vs?'':vs.b2===true?`<span class="okt">v${vs.v} (au stock) sauvegardée sur Backblaze B2</span>`:vs.b2===false?`<span class="alt">v${vs.v} (au stock) pas encore sauvegardée</span> <span class="doux">(copie chaque nuit et après chaque production)</span>`:'<span class="doux">état inconnu (Backblaze non lu à ce passage)</span>';
 const sto=(f.stories||[]).map(x=>`${esc(x.date)} : ${[x.facebook?'Facebook':'',x.instagram?'Instagram':''].filter(Boolean).join(' + ')||'—'}`).join('<br>');
 return`<details class="ep" id="ep-${esc(id)}"><summary><span class="st">${esc(f.statut)}${f.retire?' · retiré':''}</span><span class="id">${esc(f.serie)} · ${esc(id)}</span><br>${esc(f.titre||f.accroche)}</summary>
 <table>${f.retire?`<tr><td>Retiré</td><td>${esc(f.retire)}</td></tr>`:''}${chiffres?`<tr><td>Chiffres</td><td>${chiffres}</td></tr>`:''}<tr><td>Versions</td><td>${vers||'—'}${f.version_stock?`<br><b>au stock : v${f.version_stock}</b>`:''}</td></tr>
 ${sauv?`<tr><td>Sauvegarde</td><td>${sauv}</td></tr>`:''}
 ${(f.validations||[]).length?`<tr><td>Relectures</td><td>${f.validations.map(x=>`v${esc(x.v||'?')} · ${esc(x.verdict)}${x.clarte!=null?' ('+esc(x.clarte)+'/10)':''} · ${esc(dt(x.le))} · ${esc(x.relecteur||'')}`).join('<br>')}</td></tr>`:''}
 ${(f.ecarts||[]).length?`<tr><td>Écarts</td><td style="color:var(--erreur)">${f.ecarts.map(esc).join('<br>')}</td></tr>`:''}
 ${lignesReseau('Facebook',f.facebook)}${lignesReseau('Instagram',f.instagram)}${lignesReseau('TikTok',f.tiktok)}${lignesReseau('YouTube',f.youtube)}
 ${sto?`<tr><td>Story</td><td>${sto}</td></tr>`:''}</table></details>`}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function montrer(){const q=norm(document.getElementById('q').value);const l=ids.filter(id=>{const f=R[id];
 if(filtre==='refaits'&&!((f.versions||[]).length>1))return false;if(filtre==='retirés'&&!f.retire)return false;
 if(filtre==='écarts'&&!(f.ecarts||[]).length)return false;if(filtre==='validés'&&!f.version_validee)return false;
 if(!['tous','refaits','retirés','écarts','validés'].includes(filtre)&&f.statut!==filtre)return false;
 return!q||norm(id+' '+f.titre+' '+f.accroche+' '+f.serie).includes(q)});
 document.getElementById('eps').innerHTML=l.slice(0,60).map(fiche).join('')+(l.length>60?`<div class="vide">… et ${l.length-60} autres : affinez la recherche.</div>`:'')||'<div class="vide">Aucun épisode.</div>'}
function ouvrir(id){document.getElementById('q').value=id;filtre='tous';
 document.querySelectorAll('#filtres button').forEach(x=>x.classList.toggle('on',x.dataset.f==='tous'));montrer();
 const d=document.getElementById('ep-'+id);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}}
document.getElementById('q').oninput=montrer;montrer();
</script></body></html>
